server:
  port: 8080

spring:
  config:
    import: optional:classpath:quizup-prod.yml
    activate:
      on-profile: prod

  security:
    oauth2:
      authorizationserver:
        client:
          web:
            registration:
              redirect-uris:
                - https://app.quizup.local/callback
                - https://app.quizup.cnadjim.fr/callback
              post-logout-redirect-uris:
                - https://app.quizup.local
                - https://app.quizup.cnadjim.fr
          mobile:
            registration:
              redirect-uris:
                - quizup://callback
              post-logout-redirect-uris:
                - quizup://callback
          grafana:
            registration:
              redirect-uris:
                - https://grafana.quizup.cnadjim.fr/login/generic_oauth
              post-logout-redirect-uris:
                - https://grafana.quizup.cnadjim.fr
          swagger:
            registration:
              redirect-uris:
                - https://api.quizup.cnadjim.fr/swagger-ui/oauth2-redirect.html
                - https://api.quizup.cnadjim.fr/webjars/swagger-ui/oauth2-redirect.html

app:
  seed-data:
    enabled: ${QUIZUP_SEED_DATA_ENABLED:true}
  security:
    login-page-uri: ${QUIZUP_APP_LOGIN_URI:https://app.quizup.local/login}
    oauth2:
      success-redirect-uri: ${QUIZUP_APP_OAUTH2_SUCCESS_URI:https://app.quizup.local/login?social=success}
      failure-redirect-uri: ${QUIZUP_APP_OAUTH2_FAILURE_URI:https://app.quizup.local/login?error}
    cors:
      allowed-origins: ${QUIZUP_CORS_ALLOWED_ORIGINS:https://app.quizup.local}
    session:
      cookie-secure: ${QUIZUP_SESSION_COOKIE_SECURE:true}
      cookie-same-site: Lax

microservice:
  swagger:
    oauth2:
      # Identity expose son propre issuer public (surcharge le défaut partagé).
      authorization-server-url: ${QUIZUP_IDENTITY_ISSUER:https://identity.quizup.local}
