<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Fond de couleur gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cercle de fond -->
  <circle cx="96" cy="96" r="96" fill="url(#grad)"/>

  <!-- Point d'interrogation stylisé (symbole de quiz) -->
  <text x="96" y="130" font-size="120" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">?</text>
</svg>

