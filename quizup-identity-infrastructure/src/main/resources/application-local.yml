server:
  port: 8085

spring:
  config:
    import: optional:classpath:quizup-local.yml
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/quizup_identity
    username: postgres
    password: postgres

app:
  seed-data:
    enabled: true
  auth:
    # Dev/E2E uniquement : code de connexion fixe (jamais en prod).
    dev-fixed-code: "000000"
  jwk:
    # Dev uniquement : génère une clé éphémère si QUIZUP_IDENTITY_JWK est absent.
    generate-if-missing: true
