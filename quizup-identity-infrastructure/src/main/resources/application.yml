server:
  port: 8085

spring:
  application:
    name: quizup-identity
  
  datasource:
    url: jdbc:postgresql://localhost:5432/quizup_identity
    username: postgres
    password: postgres

  flyway:
    locations: classpath:db/migration/identity

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${QUIZUP_OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${QUIZUP_OAUTH2_GOOGLE_SECRET}
            scope:
              - openid
              - profile
              - email
axon:
  distributed:
    enabled: true

microservice:
  resource-server:
    enabled: false
  swagger:
    description: QuizUp Identity Module - User authentication, authorization, and client management
    use-root-path: false
    show-oauth2-endpoints: true

authentication:
  oauth2:
    clients:
      # Client credentials pour communication M2M (machine-to-machine)
      server:
        client-id: server
        client-secret: server-secret
        authentication-methods:
          - client_secret_basic
        grant-types:
          - client_credentials
        scopes:
          - openid
          - profile
          - read
          - write
        token-config:
          access-token-time-to-live: PT1H
          refresh-token-time-to-live: PT24H

      # Client mobile avec PKCE et long TTL
      mobile:
        client-id: mobile
        authentication-methods:
          - none
        grant-types:
          - authorization_code
          - refresh_token
        scopes:
          - openid
          - profile
          - offline_access
        redirect-uris:
          - quizup://callback
          - http://localhost:8100/callback
        require-proof-key: true
        require-authorization-consent: false
        token-config:
          access-token-time-to-live: PT2H
          refresh-token-time-to-live: P30D

      # Client web avec PKCE et refresh token
      web:
        client-id: web
        authentication-methods:
          - none
        grant-types:
          - authorization_code
          - refresh_token
        scopes:
          - openid
          - profile
        redirect-uris:
          - http://localhost:3000/callback
          - http://localhost:3000/auth/callback
          - http://localhost:5173/callback
          - http://localhost:5174/callback
          - http://localhost:5175/callback
          - http://localhost:4200/callback
        post-logout-redirect-uris:
          - http://localhost:3000
          - http://localhost:5173
          - http://localhost:5174
          - http://localhost:5175
          - http://localhost:4200
        require-proof-key: true
        require-authorization-consent: false
        token-config:
          access-token-time-to-live: PT30M
          refresh-token-time-to-live: P7D

      # Client Swagger UI
      swagger:
        client-id: swagger
        authentication-methods:
          - none
        grant-types:
          - authorization_code
        scopes:
          - openid
          - profile
        redirect-uris:
          - http://localhost:8080/swagger-ui/oauth2-redirect.html
          - http://localhost:8080/webjars/swagger-ui/oauth2-redirect.html
          - http://localhost:8081/swagger-ui/oauth2-redirect.html
          - http://localhost:8082/swagger-ui/oauth2-redirect.html
          - http://localhost:8083/swagger-ui/oauth2-redirect.html
          - http://localhost:8084/swagger-ui/oauth2-redirect.html
          - http://localhost:8085/swagger-ui/oauth2-redirect.html
          - http://localhost:8086/swagger-ui/oauth2-redirect.html
          - http://localhost:8087/swagger-ui/oauth2-redirect.html
          - http://localhost:8088/swagger-ui/oauth2-redirect.html
        require-proof-key: true
        require-authorization-consent: false
        token-config:
          access-token-time-to-live: PT1H

      # Client administration avec consent
      administration:
        client-id: administration
        client-secret: admin-secret
        authentication-methods:
          - client_secret_basic
        grant-types:
          - authorization_code
          - refresh_token
        scopes:
          - openid
          - profile
          - admin
        redirect-uris:
          - http://localhost:9000/callback
        require-proof-key: true
        require-authorization-consent: true
        token-config:
          access-token-time-to-live: PT30M
          refresh-token-time-to-live: P1D

logging:
  level:
    io.github.quizup: DEBUG


