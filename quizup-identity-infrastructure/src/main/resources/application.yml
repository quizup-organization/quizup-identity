spring:
  config:
    import: optional:classpath:quizup-defaults.yml
  profiles:
    default: local

  application:
    name: quizup-identity

  flyway:
    locations: classpath:db/migration/identity,classpath:db/migration/identity-framework

  security:
    oauth2:
      # Client sortant Google (social login).
      client:
        registration:
          google:
            client-id: ${QUIZUP_OAUTH2_GOOGLE_CLIENT_ID:270229696016-9u3916ckfcludqv77uiebgir65j3eurk.apps.googleusercontent.com}
            client-secret: ${QUIZUP_OAUTH2_GOOGLE_SECRET}
            scope:
              - openid
              - profile
              - email
      # Clients entrants du serveur d'autorisation (standard Spring Boot).
      # Les redirect URIs sont définies par profil (application-local/-prod.yml).
      authorizationserver:
        issuer: ${QUIZUP_IDENTITY_ISSUER:http://localhost:8085}
        client:
          # Client credentials M2M (machine-to-machine).
          server:
            registration:
              client-id: server
              client-secret: ${QUIZUP_IDENTITY_SERVER_CLIENT_SECRET:server-secret}
              client-authentication-methods: [ client_secret_basic ]
              authorization-grant-types: [ client_credentials ]
              scopes: [ openid, profile, read, write ]
            token:
              access-token-time-to-live: PT1H
              refresh-token-time-to-live: PT24H
              reuse-refresh-tokens: false

          # Client web (SPA).
          web:
            registration:
              client-id: web
              client-authentication-methods: [ none ]
              authorization-grant-types: [ authorization_code, refresh_token ]
              scopes: [ openid, profile, email ]
            require-proof-key: true
            token: &token-web-mobile { access-token-time-to-live: PT1H, refresh-token-time-to-live: P30D, reuse-refresh-tokens: false }

          # Client mobile (Expo).
          mobile:
            registration:
              client-id: mobile
              client-authentication-methods: [ none ]
              authorization-grant-types: [ authorization_code, refresh_token ]
              scopes: [ openid, profile, email ]
            require-proof-key: true
            token: *token-web-mobile

          # Client Grafana (observabilité) — confidentiel (client_secret_basic + PKCE).
          grafana:
            registration:
              client-id: grafana
              client-secret: ${QUIZUP_GRAFANA_CLIENT_SECRET:}
              client-authentication-methods: [ client_secret_basic ]
              authorization-grant-types: [ authorization_code, refresh_token ]
              scopes: [ openid, profile, email ]
            require-proof-key: true
            token:
              access-token-time-to-live: PT4H
              refresh-token-time-to-live: P30D
              reuse-refresh-tokens: false

          # Client Swagger UI (Authorization Code, sans refresh token).
          swagger:
            registration:
              client-id: swagger
              client-authentication-methods: [ none ]
              authorization-grant-types: [ authorization_code ]
              scopes: [ openid, profile ]
            require-proof-key: true
            token:
              access-token-time-to-live: PT1H
              reuse-refresh-tokens: false

app:
  authorization-server:
    audience: ${QUIZUP_IDENTITY_AUDIENCE:}
    # Liste blanche d'emails obtenant ROLE_ADMIN (consommé par Grafana via role_attribute_path).
    admin-emails: ${QUIZUP_ADMIN_EMAILS:}
  mail:
    api-key: ${QUIZUP_MAIL_API_KEY:}
    from: ${QUIZUP_MAIL_FROM:QuizUp <no-reply@quizup.cnadjim.fr>}
    base-url: ${QUIZUP_MAIL_BASE_URL:https://api.resend.com}
  jwk:
    jwk-set: ${QUIZUP_IDENTITY_JWK:}
  security:
    login-page-uri: ${QUIZUP_APP_LOGIN_URI:http://localhost:5173/login}
    oauth2:
      success-redirect-uri: ${QUIZUP_APP_OAUTH2_SUCCESS_URI:http://localhost:5173/login?social=success}
      failure-redirect-uri: ${QUIZUP_APP_OAUTH2_FAILURE_URI:http://localhost:5173/login?error}
    cors:
      allowed-origins: ${QUIZUP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
    session:
      cookie-same-site: ${QUIZUP_SESSION_COOKIE_SAME_SITE:Lax}
      cookie-secure: ${QUIZUP_SESSION_COOKIE_SECURE:false}

microservice:
  resource-server:
    enabled: false
  cors:
    enabled: false
  swagger:
    enabled: true
    description: QuizUp Identity Module - User authentication, authorization, and client management
    use-root-path: true
    show-oauth2-endpoints: true
